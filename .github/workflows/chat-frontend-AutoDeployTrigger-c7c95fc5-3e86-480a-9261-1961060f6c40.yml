name: Trigger auto deployment for chat-frontend

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/chat-frontend-AutoDeployTrigger-c7c95fc5-3e86-480a-9261-1961060f6c40.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.CHATFRONTEND_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.CHATFRONTEND_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CHATFRONTEND_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: aunkuracr.azurecr.io
          registryUsername: ${{ secrets.CHATFRONTEND_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.CHATFRONTEND_REGISTRY_PASSWORD }}
          containerAppName: chat-frontend
          resourceGroup: aunkur-ai-rg
          imageToBuild: aunkuracr.azurecr.io/chat-frontend:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


